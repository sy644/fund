<!DOCTYPE html>
<html lang="zh-CN" data-theme="cyber">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1024">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>基金加仓总览 v8</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif;}
:root{
  --bg:#0a1024;
  --card:#121a33;
  --text:#e0edff;
  --primary:#0cf;
  --green:#3f6;
  --red:#f45;
  --border:rgba(0,204,255,0.3);
}
body{background:var(--bg);color:var(--text);min-height:100vh;padding:16px 12px;}
.tab-wrap{display:flex;gap:10px;margin-bottom:20px;overflow-x:auto;padding-bottom:8px;}
.tab-btn{
  padding:12px 22px;border:none;border-radius:12px;font-size:16px;font-weight:bold;
  background:#1f2b4d;color:#b0c4de;white-space:nowrap;
}
.tab-btn.active{background:var(--green);color:#000;box-shadow:0 0 12px #3f68;}
.set-row{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:24px;
}
.set-item{
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:14px 10px;text-align:center;
}
.set-item label{font-size:13px;color:#89a2cc;display:block;margin-bottom:6px;}
.set-item select{
  background:transparent;border:none;color:var(--primary);font-size:20px;
  font-weight:bold;width:100%;outline:none;
}
#flashHint {
  position: fixed;top: 80px;left: 50%;transform: translateX(-50%);
  background: rgba(0,180,255,0.85);color:#fff;padding:8px 18px;border-radius:99px;
  opacity:0;transition: opacity 0.24s;z-index:99999;pointer-events:none;font-size:14px;
}
#flashHint.show{opacity:1;}
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;
  justify-content:center;z-index:99998;
}
.modal-box{
  background:var(--card);border:1px solid var(--primary);border-radius:16px;padding:20px;
  width:86%;max-width:420px;
}
.modal-box input{
  width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);
  background:#0f1730;color:#fff;font-size:16px;margin:14px 0;outline:none;
}
.modal-buttons{display:flex;gap:12px;justify-content:flex-end;}
.modal-btn{padding:8px 18px;border-radius:8px;border:none;font-size:15px;}
#modalOk{background:var(--primary);color:#000;}
#modalCancel{background:#333;color:#fff;}
.fund-card{
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:16px;margin-bottom:14px;
}
.fund-name{font-size:17px;font-weight:bold;margin-bottom:8px;}
.fund-info{font-size:14px;color:#a1b8dd;line-height:1.6;}
.op-btn{
  margin-top:10px;padding:6px 12px;border-radius:6px;border:none;background:#233966;
  color:var(--primary);font-size:14px;margin-right:8px;
}
</style>
</head>
<body>
<!-- 顶部分类标签 -->
<div class="tab-wrap">
  <button class="tab-btn">汇总</button>
  <button class="tab-btn active">港股</button>
  <button class="tab-btn">证券</button>
  <button class="tab-btn">煤炭</button>
  <button class="tab-btn">军工</button>
</div>

<!-- 倍率档位设置区 -->
<div class="set-row">
  <div class="set-item">
    <label>倍数</label>
    <select id="rateSelect">
      <option value="1.10">1.10</option>
      <option value="1.20">1.20</option>
      <option value="1.30">1.30</option>
    </select>
  </div>
  <div class="set-item">
    <label>幅度</label>
    <select id="dropSelect">
      <option value="3">3%</option>
      <option value="4">4%</option>
      <option value="5">5%</option>
    </select>
  </div>
  <div class="set-item">
    <label>档数</label>
    <select id="tierSelect">
      <option value="10">10</option>
      <option value="15" selected>15</option>
      <option value="20">20</option>
    </select>
  </div>
</div>

<!-- 基金列表渲染容器 -->
<div id="fundList"></div>

<!-- 浮动提示层 -->
<div id="flashHint"></div>

<script>
// 全局状态与本地存储
const STORAGE_KEY = "fundAddStateV8";
let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
  activeTab:"港股",
  rate:1.10,
  dropPercent:3,
  maxTier:15,
  funds:[
    {name:"港股恒生科技",type:"港股",basePrice:3.25,price:3.12,buys:[]},
    {name:"港股医药",type:"港股",basePrice:2.88,price:2.76,buys:[]},
    {name:"券商指数",type:"证券",basePrice:1.62,price:1.55,buys:[]},
    {name:"煤炭龙头",type:"煤炭",basePrice:2.11,price:2.18,buys:[]},
    {name:"军工ETF",type:"军工",basePrice:1.85,price:1.79,buys:[]}
  ]
};
let undoStack = [];
let redoStack = [];

// 本地保存
function save(isPushUndo = true){
  if(isPushUndo) undoStack.push(JSON.stringify(state));
  redoStack = [];
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

// 全局弹窗替代 showModal 替代原生prompt/alert
function showModal(opts = {}){
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const isPrompt = !!opts.input;
    overlay.innerHTML = `
      <div class="modal-box">
        <div>${opts.title||''}</div>
        ${isPrompt ? `<input id="modalInput" value="${opts.def||''}" placeholder="${opts.placeholder||''}">` : ''}
        <div class="modal-buttons">
          <button class="modal-btn" id="modalOk">确定</button>
          ${opts.cancel!==false?`<button class="modal-btn" id="modalCancel">取消</button>`:''}
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const box = overlay.querySelector('.modal-box');
    const input = box.querySelector('#modalInput');
    if(input){ input.focus(); input.select(); }

    function close(val){
      document.body.removeChild(overlay);
      resolve(val);
    }
    box.querySelector('#modalOk').onclick = ()=>{
      close(isPrompt ? (input?input.value:opts.def) : true);
    };
    if(opts.cancel!==false){
      box.querySelector('#modalCancel').onclick = ()=>close(isPrompt?null:false);
    }
    if(isPrompt && input){
      input.addEventListener('keydown',e=>{
        if(e.key==='Enter') close(input.value);
        if(e.key==='Escape') close(null);
      })
    }
  })
}

// 屏蔽原生弹窗，避免页面多余提示
window.prompt = function(msg,def){
  console.warn('禁止使用原生prompt，请使用showModal',msg);
  return def||'';
};
window.alert = function(msg){
  console.warn('禁止使用原生alert，请使用flashHint',msg);
};

// 新增买入记录
function addBuyDialog(idx){
  const f = state[idx];
  const prevState = JSON.stringify(state);
  f.buys.push({
    date: new Date().toISOString().split('T')[0],
    type:'buy',
    price: f.price || f.basePrice || 0,
    amount:0,
    tier:0
  });
  save(true);
  render();
  flashHint("已新增一笔加仓记录");
}

// 撤销操作
function undo(){
  if(undoStack.length === 0){
    flashHint('没有可撤销的操作');
    return;
  }
  redoStack.push(JSON.stringify(state));
  const prev = undoStack.pop();
  state = JSON.parse(prev);
  save(false);
  render();
  flashHint('↩ 已撤销');
}

// 重做操作
function redo(){
  if(redoStack.length === 0){
    flashHint('没有可重做的操作');
    return;
  }
  undoStack.push(JSON.stringify(state));
  const next = redoStack.pop();
  state = JSON.parse(next);
  save(false);
  render();
  flashHint('↪ 已重做');
}

// 顶部浮动短时提示
function flashHint(text){
  let h = document.getElementById('flashHint');
  h.textContent = text;
  h.classList.add('show');
  clearTimeout(h._t);
  h._t = setTimeout(()=>h.classList.remove('show'),1200);
}

// 页面整体渲染
function render(){
  // 同步配置值
  state.rate = Number(document.getElementById('rateSelect').value);
  state.dropPercent = Number(document.getElementById('dropSelect').value);
  state.maxTier = Number(document.getElementById('tierSelect').value);

  // 标签激活切换
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.classList.toggle('active', btn.textContent === state.activeTab);
  })
  // 筛选当前分类基金
  let showList = state.funds;
  if(state.activeTab !== '汇总'){
    showList = state.funds.filter(item=>item.type === state.activeTab);
  }
  // 渲染基金卡片
  const wrap = document.getElementById('fundList');
  wrap.innerHTML = '';
  showList.forEach((fund,idx)=>{
    const realIdx = state.funds.findIndex(f=>f.name===fund.name);
    const dropRatio = ((fund.basePrice - fund.price)/fund.basePrice *100).toFixed(2);
    const card = document.createElement('div');
    card.className = 'fund-card';
    card.innerHTML = `
      <div class="fund-name">${fund.name}</div>
      <div class="fund-info">
        基准价：${fund.basePrice}<br>
        当前净值：${fund.price}<br>
        下跌幅度：${dropRatio}%<br>
        已有加仓次数：${fund.buys.length}
      </div>
      <button class="op-btn add-buy" data-i="${realIdx}">新增加仓</button>
      <button class="op-btn undo-btn">撤销上一步</button>
      <button class="op-btn redo-btn">重做</button>
    `;
    wrap.appendChild(card);
  })
  // 绑定按钮事件
  document.querySelectorAll('.add-buy').forEach(btn=>{
    btn.onclick = ()=>addBuyDialog(Number(btn.dataset.i));
  })
  document.querySelector('.undo-btn').onclick = undo;
  document.querySelector('.redo-btn').onclick = redo;
}

// 绑定标签切换事件
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.onclick = ()=>{
    state.activeTab = btn.textContent;
    save(false);
    render();
  }
})
// 倍率档位修改自动刷新
document.querySelectorAll('.set-item select').forEach(sel=>{
  sel.onchange = ()=>{save(false);render();}
})

// 页面初始化执行
render();
</script>
</body>
</html>
