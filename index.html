<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>持仓收益仪表盘</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>基金持仓收益统计面板</h2>
        <!-- 环形完成度+参数设置区域 -->
        <div class="top-wrap">
            <div class="ring-box">
                <svg width="140" height="140" viewBox="0 0 180 180">
                    <circle class="ring-bg" cx="90" cy="90" r="82" fill="none" stroke="#2a3447" stroke-width="12"/>
                    <circle class="ring-fill" cx="90" cy="90" r="82" fill="none" stroke="#8a9bb5" stroke-width="12" stroke-linecap="round"
                            stroke-dasharray="540" stroke-dashoffset="540" transform="rotate(-90 90 90)"/>
                </svg>
                <div class="ring-text">完成度<br><span id="percentText">0%</span></div>
            </div>
            <!-- 参数设置面板 带定制边框样式 -->
            <div class="setting-panel">
                <h4>参数设置</h4>
                <div class="set-item">
                    <label>定投基准价：</label>
                    <input type="number" step="0.0001" id="basePrice">
                </div>
                <div class="set-item">
                    <label>单次定投金额：</label>
                    <input type="number" id="perMoney">
                </div>
                <button id="saveSetBtn">保存参数</button>
            </div>
        </div>

        <!-- 持仓表格 -->
        <table class="fund-table">
            <thead>
                <tr>
                    <th>基金代码</th>
                    <th>基金名称</th>
                    <th>当前净值</th>
                    <th>持仓份额</th>
                    <th>持仓市值</th>
                    <th>持仓收益</th>
                    <th>收益率</th>
                </tr>
            </thead>
            <tbody id="fundTbody"></tbody>
        </table>

        <!-- 合计汇总 -->
        <div class="total-box">
            总投入本金：<span id="totalCost">0</span> 元｜
            总持仓市值：<span id="totalValue">0</span> 元｜
            合计总收益：<span id="totalProfit">0</span> 元｜
            整体收益率：<span id="totalRate">0%</span>
        </div>
    </div>

    <!-- 全局初始化变量：仅此处定义，app.js不再重复声明state -->
    <script>
        // 兜底初始化数据，全局唯一，不会和JS内变量重复
        window.FUNDS_INIT = [
            {code:"513770",name:"港股互联",share:1200,costPrice:0.6722},
            {code:"161725",name:"白酒",share:800,costPrice:0.9210}
        ];
        window.NAV_HISTORY_INIT = [
            { code: '513770', name: '港股互联', date: '2026-08-04', nav: 0.7126, ts: Date.now() },
            { code: '513770', name: '港股互联', date: '2026-07-22', nav: 0.6596, ts: Date.now() },
            { code: '513770', name: '港股互联', date: '2026-07-23', nav: 0.6643, ts: Date.now() },
            { code: '513770', name: '港股互联', date: '2026-07-17', nav: 0.6643, ts: Date.now() },
            { code: '513770', name: '港股互联', date: '2026-07-15', nav: 0.6660, ts: Date.now() },
            { code: '161725', name: '白酒', date: '2025-01-10', nav: 0.9, ts: Date.now() },
            { code: '161725', name: '白酒', date: '2025-01-12', nav: 0.905, ts: Date.now() }
        ];
        // 全局状态 【只声明这一次！！！】
        window.state = {
            fundList: window.FUNDS_INIT,
            navMap: {},
            setting: { basePrice: 0.7, perMoney: 500 }
        };
    </script>
    <!-- JS仅引入一次，内部绝不重新let state -->
    <script src="app.js"></script>
</body>
</html>
