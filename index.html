<!DOCTYPE html>
<html lang="zh-CN" data-theme="cyber">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1024">
<title>基金加仓总览</title>
<style>
:root,[data-theme="cyber"] {
  --bg-0:#050714;--bg-1:#0a0e22;--bg-2:#131a35;--space-bg:url('bg/space.jpg');
  --card:rgba(20,26,56,0.55);--card-solid:#131a35;--card-line:rgba(0,240,255,0.25);
  --text:#e6f6ff;--text-dim:#8aa5c4;--text-bright:#fff;
  --neon-cyan:#00e5ff;--neon-magenta:#ff2bd6;--neon-yellow:#ffd400;--neon-green:#39ff14;
  --neon-orange:#ff9500;--neon-red:#ff2e4c;--neon-pink:#ff5fa0;--neon-blue:#4a8af4;
  --header-bg:linear-gradient(180deg,rgba(10,14,34,.85),rgba(5,7,20,.6));
  --title-color:var(--neon-cyan);--title-glow:0 0 12px rgba(0,229,255,.6);
  --btn-bg:transparent;--btn-border:rgba(0,229,255,.5);--btn-color:var(--neon-cyan);--btn-size:36px;
  --shadow-card:0 4px 24px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05);
  --glow-cyan:0 0 16px rgba(0,229,255,.5),0 0 4px rgba(0,229,255,.8);
  --glow-yellow:0 0 16px rgba(255,212,0,.6),0 0 4px rgba(255,212,0,.9);
  --glow-green:0 0 16px rgba(57,255,20,.6),0 0 4px rgba(57,255,20,.9);
  --glow-orange:0 0 16px rgba(255,149,0,.6),0 0 4px rgba(255,149,0,.9);
  --glow-red:0 0 16px rgba(255,46,76,.6),0 0 4px rgba(255,46,76,.9);
  --gradient-green:linear-gradient(135deg,#00ff88,#00b8ff);
  --gradient-orange:linear-gradient(135deg,#ffd400,#ff9500);
  --gradient-pink:linear-gradient(135deg,#ff5fa0,#ff2bd6);
  --gradient-blue:linear-gradient(135deg,#00e5ff,#4a8af4);
  --gradient-red:linear-gradient(135deg,#ff2e4c,#b14eff);
  --input-bg:rgba(5,7,20,.6);--pulse-on:1;
}
[data-theme="dark"] {
  --bg-0:#0b1220;--bg-1:#0b1220;--bg-2:#0b1220;--space-bg:none;
  --card:#1e293b;--card-solid:#1e293b;--card-line:#334155;--text:#f1f5f9;
  --text-dim:#94a3b8;--text-bright:#fff;
  --neon-cyan:#60a5fa;--neon-magenta:#a78bfa;--neon-yellow:#fbbf24;
  --neon-green:#22c55e;--neon-orange:#f97316;--neon-red:#ef4444;
  --neon-pink:#ec4899;--neon-blue:#60a5fa;
  --header-bg:linear-gradient(135deg,#1e293b,#0f172a);--title-color:#f1f5f9;--title-glow:none;
  --btn-bg:#334155;--btn-border:transparent;--btn-color:#e2e8f0;--btn-size:32px;
  --shadow-card:0 1px 3px rgba(0,0,0,.3);
  --glow-cyan:none;--glow-yellow:none;--glow-green:none;--glow-orange:none;--glow-red:none;
  --gradient-green:#22c55e;--gradient-orange:#f97316;--gradient-pink:#ec4899;
  --gradient-blue:#60a5fa;--gradient-red:#ef4444;--input-bg:#0f172a;--pulse-on:0;
}
[data-theme="light"] {
  --bg-0:#f0f2f5;--bg-1:#f0f2f5;--bg-2:#fff;--space-bg:none;
  --card:#fff;--card-solid:#fff;--card-line:#e5e7eb;--text:#1f2937;
  --text-dim:#6b7280;--text-bright:#111827;
  --neon-cyan:#2563eb;--neon-magenta:#c026d3;--neon-yellow:#d97706;
  --neon-green:#16a34a;--neon-orange:#ea580c;--neon-red:#dc2626;
  --neon-pink:#db2777;--neon-blue:#2563eb;
  --header-bg:linear-gradient(135deg,#305496,#1F4E78);--title-color:#fff;--title-glow:none;
  --btn-bg:#fff;--btn-border:transparent;--btn-color:#305496;--btn-size:32px;
  --shadow-card:0 1px 3px rgba(0,0,0,.08);
  --glow-cyan:none;--glow-yellow:none;--glow-green:none;--glow-orange:none;--glow-red:none;
  --gradient-green:#16a34a;--gradient-orange:#ea580c;--gradient-pink:#db2777;
  --gradient-blue:#2563eb;--gradient-red:#dc2626;--input-bg:#fffef0;--pulse-on:0;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg-0);color:var(--text);font-size:13px;line-height:1.35;padding-bottom:30px;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;min-height:100vh;overflow-x:hidden}
[data-theme="cyber"] body{background:linear-gradient(180deg,rgba(5,7,20,.3),rgba(5,7,20,.6)),var(--space-bg) center top/cover no-repeat,var(--bg-0);background-attachment:fixed,fixed,fixed}
[data-theme="cyber"] body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;background:linear-gradient(rgba(0,229,255,.03) 1px,transparent 1px) 0 0/100% 60px;opacity:.5}
input,textarea,select{-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default;font-family:inherit}
header,header *,.tab,.tab *,.tab-add{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important}
header{background:var(--header-bg);padding:6px 10px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:flex-end;gap:8px;border-bottom:1px solid var(--card-line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);flex-wrap:nowrap;overflow:hidden;min-height:44px}
header h1{font-size:16px;font-weight:800;flex-shrink:0;white-space:nowrap;letter-spacing:1px;color:var(--title-color);text-shadow:var(--title-glow);display:flex;align-items:center;gap:4px}
.header-time{font-size:10px;color:var(--neon-cyan);text-shadow:calc(var(--pulse-on)*0 0 6px rgba(0,229,255,.6));background:var(--input-bg);padding:3px 8px;border-radius:20px;border:1px solid var(--card-line);font-family:monospace;letter-spacing:.5px;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.save-status{font-size:9px;color:var(--neon-green);background:color-mix(in srgb,var(--neon-green) 15%,transparent);padding:2px 6px;border-radius:16px;border:1px solid color-mix(in srgb,var(--neon-green) 40%,transparent);font-family:monospace;flex-shrink:0}
.save-status:not(.saved){color:var(--text-dim);background:color-mix(in srgb,var(--text-dim) 10%,transparent);border-color:color-mix(in srgb,var(--text-dim) 30%,transparent);text-shadow:none}
.header-btns{display:flex;gap:6px;flex-shrink:0;margin-left:auto}
.refresh-btn{background:var(--btn-bg);color:var(--btn-color);border:1.5px solid var(--btn-border);width:var(--btn-size);height:var(--btn-size);border-radius:50%;font-size:16px;cursor:pointer;flex-shrink:0;transition:all .2s;display:flex;align-items:center;justify-content:center;padding:0}
[data-theme="cyber"] .refresh-btn:hover{transform:scale(1.1);box-shadow:var(--glow-cyan);background:color-mix(in srgb,var(--neon-cyan) 15%,transparent)}
#themeBtn{color:var(--neon-yellow);border-color:color-mix(in srgb,var(--neon-yellow) 60%,transparent)}
#logoutBtn{color:var(--neon-magenta);border-color:color-mix(in srgb,var(--neon-magenta) 60%,transparent)}
#saveBtn{color:var(--neon-green);border-color:color-mix(in srgb,var(--neon-green) 60%,transparent)}
#excelBtn{color:var(--neon-blue);border-color:color-mix(in srgb,var(--neon-blue) 60%,transparent)}
#exportBtn{color:var(--neon-pink);border-color:color-mix(in srgb,var(--neon-pink) 60%,transparent)}
.refresh-btn:disabled{opacity:.4}
main{padding:8px;display:flex;flex-direction:column;gap:10px;position:relative;z-index:3}
.tab-bar{display:flex;background:linear-gradient(180deg,#050714,#050714 70%,transparent)!important;padding:12px 8px 8px;border:none;position:sticky;top:0;z-index:50;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:6px;margin-bottom:0;min-height:56px}
.tab-content{margin-top:8px;position:relative;z-index:1;padding-top:4px}
.tab{flex:1;min-width:60px;padding:10px 14px;background:color-mix(in srgb,var(--neon-cyan) 4%,rgba(20,26,56,.6))!important;border:1.5px solid color-mix(in srgb,var(--neon-cyan) 15%,transparent)!important;color:var(--text-dim)!important;font-size:14px;font-weight:700;cursor:pointer;border-radius:20px;transition:all .2s;white-space:nowrap;text-align:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tab.active{color:#05060b!important;border-color:var(--neon-green)!important;background:linear-gradient(135deg,var(--neon-green),#00cc66)!important;text-shadow:none;box-shadow:0 0 16px rgba(57,255,20,.7),0 0 4px rgba(57,255,20,1),inset 0 1px 0 rgba(255,255,255,.3);font-weight:800}
.tab.tab-summary{font-weight:800}
.tab.tab-summary.active{color:#05060b!important;border-color:var(--neon-green)!important;background:linear-gradient(135deg,var(--neon-green),#00cc66)!important;box-shadow:0 0 16px rgba(57,255,20,.7),0 0 4px rgba(57,255,20,1);text-shadow:none}
.tab:active{transform:scale(.95)}
.tab-add{flex:0 0 40px;background:linear-gradient(135deg,var(--neon-green),#00cc66)!important;color:#05060b!important;border:none;font-size:22px;font-weight:900;cursor:pointer;border-radius:20px;padding:0;line-height:1}
[data-theme="cyber"] .tab-add{box-shadow:var(--glow-green)}
.tab-add:active{transform:scale(.9)}
.tab-save-btn{flex:0 0 40px;background:linear-gradient(135deg,#4ade80,#22c55e)!important;color:#05060b!important;font-size:18px;border:none;padding:0;cursor:pointer}
.tab-save-btn:hover{box-shadow:0 0 12px rgba(74,222,128,.6)!important}
.tab{padding:6px 10px}
.tab.pressing{transform:scale(.95);background:color-mix(in srgb,var(--neon-red) 30%,transparent)!important;color:var(--neon-red)!important}
.tab-hint{position:fixed;top:110px;left:50%;transform:translateX(-50%) translateY(-20px);background:color-mix(in srgb,var(--neon-red) 95%,transparent)!important;color:#fff!important;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:700;z-index:9999;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;box-shadow:var(--glow-red)}
.tab-hint.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fund,.tier-section,.buy-section,.buy-table-wrap,.advice-card,.sum-table-wrap{background:var(--card)!important;color:var(--text)!important;border:1px solid var(--card-line);border-radius:24px;box-shadow:var(--shadow-card);backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);position:relative;overflow:hidden}
[data-theme="cyber"] .fund{box-shadow:0 0 24px rgba(0,229,255,.25),0 0 4px rgba(0,229,255,.4),inset 0 1px 0 rgba(255,255,255,.05);border-color:rgba(0,229,255,.35)}
.fund-head{display:grid;grid-template-columns:1.2fr 1fr .8fr;gap:8px;background:transparent!important;border-bottom:none;border-radius:0;overflow:visible;margin-bottom:0;padding:0}
.fund-name{padding:14px 16px;font-weight:800;font-size:16px;display:flex;flex-direction:column;justify-content:center;border:none;color:var(--text-bright);letter-spacing:.5px;background:color-mix(in srgb,var(--neon-cyan) 6%,transparent);border-radius:20px}
.code-mini{font-size:9px;color:var(--text-dim);font-weight:500;font-family:monospace}
.fund-price{padding:12px 6px;text-align:center;display:flex;flex-direction:column;justify-content:center;border:none;background:linear-gradient(135deg,#ffd000,#ff9500)!important;color:#05060b;font-weight:800;border-radius:20px;box-shadow:0 0 20px rgba(255,149,0,.5),inset 0 1px 0 rgba(255,255,255,.3)}
[data-theme="cyber"] .fund-price{box-shadow:inset 0 0 12px rgba(255,149,0,.3)}
.fund-price .lbl{color:#05060b!important;font-weight:700;font-size:9px;opacity:.7}
.fund-price .val,.fund-price .price-input{color:#05060b!important;font-weight:800}
.fund-price .price-input{background:transparent!important;border:none!important;text-align:center;font-size:18px;border-radius:0;padding:0;outline:none;-webkit-appearance:none;appearance:none;width:100%;font-family:inherit;color:#05060b!important;text-shadow:0 1px 2px rgba(255,255,255,.2)}
.fund-extra{padding:14px 12px;text-align:center;display:flex;flex-direction:column;justify-content:center;border:none;background:color-mix(in srgb,var(--neon-cyan) 6%,transparent);border-radius:20px}
.lbl{font-size:9px;color:var(--text-dim);display:block;margin-bottom:2px;letter-spacing:.5px;text-transform:uppercase;font-weight:600}
.val{font-size:14px;font-weight:700;color:var(--text-bright);font-family:-apple-system,sans-serif}
.fund-price input{width:100%;border:none;background:transparent;font-size:15px;font-weight:800;color:#05060b;text-align:center;font-family:inherit;padding:0;-moz-appearance:textfield}
.fund-price input::-webkit-outer-spin-button,.fund-price input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.neighbor-section{padding:8px 6px}
.nb-hbar{display:flex;width:100%;gap:12px;align-items:center;justify-content:center}
.nb-hseg{flex:0 0 auto;width:96px;height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px;border-radius:50%;background:var(--gradient-orange)!important;color:#05060b;border:none;text-align:center;aspect-ratio:1/1}
.nb-hseg:nth-child(2){background:var(--gradient-orange)!important}
.nb-hseg:nth-child(3){background:var(--gradient-pink)!important;color:#fff}
.nb-hseg.cur{outline:3px solid var(--neon-yellow);outline-offset:3px;transform:scale(1.05);box-shadow:var(--glow-yellow);animation:nb-breathe 1.6s ease-in-out infinite}
@keyframes nb-breathe{0%,100%{box-shadow:0 0 8px rgba(255,212,0,.5),0 0 2px rgba(255,212,0,.8);filter:brightness(1)}50%{box-shadow:0 0 20px rgba(255,212,0,.9),0 0 6px rgba(255,212,0,1);filter:brightness(1.15)}}
.nb-tier-tag{font-size:10px;font-weight:700;color:rgba(5,6,11,.7)!important;margin-bottom:2px;letter-spacing:0}
.nb-hseg:nth-child(3) .nb-tier-tag{color:rgba(255,255,255,.85)!important}
.nb-hlabel{font-size:9px;color:#05060b!important;font-weight:800;text-align:center;line-height:1.15;padding:0 2px;word-break:break-all}
.nb-hseg:nth-child(3) .nb-hlabel{color:#fff!important}
.ring-section{display:flex;align-items:center;gap:10px;padding:10px 12px;background:transparent!important;border:none!important;margin:0}
.ring-center{flex:0 0 auto;position:relative;width:168px;height:168px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-svg{width:168px;height:168px;display:block;filter:drop-shadow(calc(var(--pulse-on)*0 0 8px var(--neon-cyan)))}
.ring-svg .ring-track{stroke:color-mix(in srgb,var(--neon-cyan) 20%,transparent);fill:none;stroke-width:8}
.ring-svg .ring-fill{stroke-width:8;stroke-linecap:round;filter:drop-shadow(calc(var(--pulse-on)*0 0 6px var(--neon-green)))}
.ring-fill-anim{animation:ring-grow 1.4s cubic-bezier(.34,1.56,.64,1) forwards,ring-breathe 2.4s ease-in-out 1.4s infinite}
@keyframes ring-grow{0%{stroke-dashoffset:276.46}100%{stroke-dashoffset:var(--target-dashoffset,0)}}
@keyframes ring-breathe{0%,100%{filter:drop-shadow(0 0 4px var(--neon-cyan)) drop-shadow(0 0 2px var(--neon-green));opacity:.92}50%{filter:drop-shadow(0 0 14px var(--neon-green)) drop-shadow(0 0 6px var(--neon-cyan));opacity:1}}
.ring-svg .ring-pct{fill:var(--neon-green);font-size:22px;font-weight:800}
.ring-svg .ring-sub{fill:var(--text-dim);font-size:9px}
.ring-foot{position:absolute;bottom:0;font-size:10px;color:#93A3BD;letter-spacing:.3px;white-space:nowrap}
.hold-side{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:5px}
.hold-side .ps-item{display:flex;align-items:center;justify-content:space-between;background:rgba(20,26,56,.5);border:1px solid rgba(0,240,255,.2);border-radius:12px;padding:5px 8px;gap:4px;min-width:0}
.hold-side .ps-item .lbl{font-size:10px;color:#8a9bb5;font-weight:600;flex-shrink:0;white-space:nowrap}
.hold-side .hold-side-val{font-size:12px;font-weight:800;color:#c5d4e3;font-family:-apple-system,monospace;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tier-section{padding:8px 10px;background:transparent!important;border:none!important;margin:0}
.section-title{font-size:12px;font-weight:800;color:var(--text-bright);margin-bottom:4px;padding:4px 0;display:flex;justify-content:space-between;align-items:center;letter-spacing:.5px}
.tier-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.tier-row{display:grid;grid-template-columns:.8fr 1fr .8fr;font-size:11px;padding:6px 10px;align-items:center;border-radius:16px;background:var(--input-bg)!important;border:1px solid transparent;font-family:-apple-system,monospace;position:relative}
.tier-row .t-label{font-weight:700;color:var(--text);font-size:11px}
.tier-row .t-trigger{color:var(--text-dim);font-size:11px;text-align:center;font-weight:600}
.tier-row .t-amt{font-weight:800;color:var(--neon-cyan);text-align:right}
.tier-row.current-tier{background:var(--gradient-orange)!important;border-color:var(--neon-yellow)!important;box-shadow:var(--glow-yellow);animation:pulse-row 1.6s ease-in-out infinite}
.tier-row.current-tier .t-label,.tier-row.current-tier .t-trigger,.tier-row.current-tier .t-amt{color:#05060b!important;text-shadow:none}
.tier-row.current-tier::after{content:"⭐";position:absolute;right:-2px;top:-8px;font-size:16px;filter:drop-shadow(0 0 4px var(--neon-yellow));animation:star-spin 2s linear infinite}
@keyframes pulse-row{0%,100%{box-shadow:0 0 8px rgba(255,212,0,.4)}50%{box-shadow:0 0 16px rgba(255,212,0,.8),0 0 4px rgba(255,212,0,.6)}}
@keyframes star-spin{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.2) rotate(15deg)}}
.tier-row.base-tier{background:color-mix(in srgb,var(--neon-blue) 12%,transparent)!important}
.tier-row.mid-tier{background:color-mix(in srgb,var(--neon-orange) 12%,transparent)!important}
.tier-row.buy-tier{background:color-mix(in srgb,var(--neon-green) 12%,transparent)!important}
.tier-row.buy-tier .t-amt{color:var(--neon-green)}
.param-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 12px 14px;background:transparent!important;border:none!important}
.ps-item{background:linear-gradient(180deg,#fff,#e0f2fe)!important;border:1.5px solid rgba(0,240,255,.4)!important;border-radius:16px;padding:6px 10px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:4px;box-shadow:0 0 8px rgba(0,240,255,.2)}
.ps-item .lbl{font-size:11px;color:#1e293b;font-weight:700;flex-shrink:0}
.ps-item select.param-select{flex:1;font-size:16px;font-weight:800;color:#00f0ff!important;background:transparent;border:none;text-align:right;cursor:pointer;outline:none;text-shadow:0 0 6px rgba(0,240,255,.5);-webkit-appearance:none;-moz-appearance:none;appearance:none;padding:0 14px 0 0;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M0 0 L5 6 L10 0 Z' fill='%2300f0ff'/></svg>");background-repeat:no-repeat;background-position:right center;background-size:8px}
.buy-section{padding:8px 10px}
.buy-btns{display:inline-flex;gap:3px;float:right;align-items:center}
.buy-btns .add-btn{padding:2px 7px;font-size:12px;min-width:24px;line-height:1.4;border-radius:6px}
.add-btn{background:rgba(0,240,255,.08)!important;color:#67e8f9!important;border:1.5px solid rgba(0,240,255,.3);padding:4px 12px;border-radius:20px;font-size:11px;cursor:pointer;font-weight:800;letter-spacing:.5px;transition:all .2s ease;box-shadow:none!important}
.add-btn:hover{background:rgba(0,240,255,.18)!important;box-shadow:0 0 8px rgba(0,240,255,.2)!important}
.buy-grid-head{display:grid;grid-template-columns:1.3fr 1fr 1.1fr .9fr;gap:8px;background:transparent;color:var(--neon-cyan);font-size:12px;font-weight:700;padding:8px 6px 6px;letter-spacing:.5px;text-align:center;text-shadow:0 0 6px rgba(0,240,255,.4)}
.buy-grid-body{display:flex;flex-direction:column;padding:0 6px;gap:8px}
.buy-grid-foot{display:grid;grid-template-columns:1.3fr 1fr 1.1fr .9fr;gap:8px;background:linear-gradient(135deg,rgba(0,240,255,.28),rgba(56,189,248,.18));color:#fff!important;font-weight:800;font-size:13px;padding:10px 6px;text-shadow:0 0 8px rgba(0,240,255,.5);text-align:center;border-top:1px solid rgba(0,240,255,.3);border-radius:0 0 20px 20px;margin:8px 0 0;box-shadow:0 -4px 16px rgba(0,240,255,.15)}
