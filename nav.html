<!DOCTYPE html>
<html lang="zh-CN" data-theme="cyber">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1024">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>手动记录净值 · R1</title>
<style>
:root {
  --bg-1: #0a1024;
  --bg-2: #1a2540;
  --neon-cyan: #00f0ff;
  --neon-orange: #ff9500;
  --neon-pink: #ff3c8c;
  --neon-green: #00f5c8;
  --neon-yellow: #ffd000;
  --neon-red: #ff5fa0;
  --text-bright: #e0e8ff;
  --text-dim: #93A3BD;
  --card-bg: rgba(20, 26, 56, 0.7);
  --card-line: rgba(0, 240, 255, 0.25);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  min-height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
  background: var(--bg-1);
  color: var(--text-bright);
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 20% 30%, rgba(255,149,0,0.10) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(0,245,200,0.08) 0%, transparent 50%);
  z-index: 0;
  pointer-events: none;
}
/* 顶部 */
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: rgba(10, 16, 36, 0.92);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--card-line);
}
.back-btn {
  display: flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: 50%;
  background: rgba(0, 240, 255, 0.15);
  border: 1.5px solid var(--neon-cyan);
  color: var(--neon-cyan);
  text-decoration: none; font-size: 18px; font-weight: 900;
  box-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
}
.topbar-title {
  font-size: 15px; font-weight: 800;
  color: var(--neon-cyan);
  text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
  letter-spacing: 1px; flex: 1;
}
.topbar-status { font-size: 10px; color: var(--text-dim); font-family: monospace; }
.container {
  position: relative; z-index: 1;
  max-width: 600px; margin: 0 auto; padding: 14px;
}
/* 基金卡片切换 */
.fund-tabs {
  display: flex; gap: 8px; overflow-x: auto;
  padding: 4px 0 12px; margin-bottom: 12px;
  scrollbar-width: none;
}
.fund-tabs::-webkit-scrollbar { display: none; }
.fund-card {
  flex: 0 0 auto;
  min-width: 110px;
  padding: 10px 14px;
  border-radius: 14px;
  background: var(--card-bg);
  border: 1.5px solid var(--card-line);
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
}
.fund-card:hover { transform: translateY(-1px); }
.fund-card::after {
  content: '双击加仓';
  position: absolute; left: 0; right: 0; bottom: 2px;
  font-size: 8px; color: var(--text-dim);
  opacity: 0; transition: opacity 0.2s;
  letter-spacing: 0.5px;
}
.fund-card:hover::after { opacity: 0.6; }
.fund-card.active {
  border-color: var(--neon-cyan);
  box-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
  background: rgba(0, 240, 255, 0.12);
}
.fund-card-name {
  font-size: 12px; font-weight: 800; color: var(--text-bright);
  letter-spacing: 0.5px; margin-bottom: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100px;
}
.fund-card-code {
  font-size: 9px; color: var(--text-dim); font-family: monospace;
}
.fund-card-count {
  position: absolute; top: 4px; right: 6px;
  font-size: 9px; color: var(--neon-cyan);
  font-family: monospace; font-weight: 700;
}
.fund-card.active .fund-card-count { color: var(--neon-yellow); }
/* 通用卡片 */
.form-card {
  background: var(--card-bg);
  border: 1.5px solid var(--card-line);
  border-radius: 16px;
  padding: 14px; margin-bottom: 14px;
}
.form-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; font-weight: 800;
  color: var(--neon-cyan); letter-spacing: 1px;
  margin-bottom: 12px;
  text-shadow: 0 0 6px rgba(0, 240, 255, 0.4);
}
.form-title::before {
  content: ''; width: 3px; height: 12px;
  background: var(--neon-cyan);
  border-radius: 2px;
  box-shadow: 0 0 6px var(--neon-cyan);
}
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.form-row.full { grid-template-columns: 1fr; }
.form-label { font-size: 10px; color: var(--text-dim); letter-spacing: 1px; margin-bottom: 4px; display: block; }
.form-input, .form-select {
  width: 100%; background: rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(0, 240, 255, 0.3);
  border-radius: 10px; padding: 10px 12px;
  color: #fff; font-size: 14px;
  font-family: -apple-system, monospace;
  outline: none; text-align: right;
}
.form-select { text-align: left; }
.form-input:focus, .form-select:focus {
  border-color: var(--neon-cyan);
  box-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
}
.form-input.shake { animation: shake 0.4s; border-color: var(--neon-red); }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}
.action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.btn {
  display: flex; align-items: center; justify-content: center;
  gap: 6px; padding: 10px;
  border: none; border-radius: 10px;
  font-size: 13px; font-weight: 800; cursor: pointer;
  letter-spacing: 1px; font-family: inherit;
}
.btn-add { background: linear-gradient(135deg, #00f0ff, #00b4d8); color: #05060b; box-shadow: 0 0 12px rgba(0, 240, 255, 0.4); }
.btn-pick { background: linear-gradient(135deg, #ff9500, #ffd000); color: #05060b; box-shadow: 0 0 12px rgba(255, 149, 0, 0.4); }
.btn-recognize { background: linear-gradient(135deg, #ff3c8c, #ff5fa0); color: #fff; box-shadow: 0 0 12px rgba(255, 60, 140, 0.4); grid-column: span 2; }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.preview-box {
  margin-top: 8px; display: none; position: relative;
  border: 1.5px dashed rgba(0, 240, 255, 0.3);
  border-radius: 10px; padding: 8px;
  background: rgba(0, 0, 0, 0.3);
}
.preview-box.show { display: block; }
.preview-img { width: 100%; max-height: 240px; object-fit: contain; border-radius: 6px; }
.preview-remove {
  position: absolute; top: 6px; right: 6px;
  width: 24px; height: 24px; border-radius: 50%;
  background: rgba(255, 95, 160, 0.9); border: none; color: #fff;
  font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.ocr-status {
  margin-top: 8px; font-size: 11px; text-align: center;
  padding: 6px; border-radius: 6px; display: none;
}
.ocr-status.show { display: block; }
.ocr-status.loading { background: rgba(0, 240, 255, 0.1); color: var(--neon-cyan); }
.ocr-status.ok { background: rgba(22, 163, 74, 0.15); color: #4ade80; }
.ocr-status.err { background: rgba(220, 38, 38, 0.15); color: var(--neon-red); }
.history-card { background: var(--card-bg); border: 1.5px solid var(--card-line); border-radius: 16px; padding: 14px; margin-bottom: 14px; }
.history-empty { text-align: center; color: var(--text-dim); padding: 30px 14px; font-size: 12px; }
.history-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.history-table thead tr { background: rgba(0, 240, 255, 0.15); }
.history-table th { padding: 8px 6px; text-align: left; color: var(--neon-cyan); font-size: 11px; font-weight: 800; letter-spacing: 1px; text-shadow: 0 0 6px rgba(0, 240, 255, 0.4); }
.history-table th.r, .history-table td.r { text-align: right; }
.history-table th.c, .history-table td.c { text-align: center; }
.history-table tbody tr { border-top: 1px solid rgba(0, 240, 255, 0.1); transition: background 0.2s; }
.history-table tbody tr:hover { background: rgba(0, 240, 255, 0.05); }
.history-table td { padding: 8px 6px; color: var(--text-bright); font-family: -apple-system, monospace; }
.history-table .code { color: var(--text-dim); font-size: 10px; }
.history-table .nav { color: var(--neon-green); font-weight: 800; }
.history-table .del-btn { background: transparent; border: none; color: var(--neon-red); font-size: 16px; cursor: pointer; font-weight: 900; }
.ocr-overlay {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85);
  z-index: 99999; display: none; align-items: center;
  justify-content: center; flex-direction: column; gap: 14px;
  color: var(--neon-cyan); font-size: 14px; letter-spacing: 2px;
}
.ocr-overlay.show { display: flex; }
.ocr-spinner {
  width: 50px; height: 50px;
  border: 4px solid rgba(0, 240, 255, 0.2);
  border-top-color: var(--neon-cyan);
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.toast {
  position: fixed; top: 70px; left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: rgba(0, 240, 255, 0.95); color: #05060b;
  padding: 10px 22px; border-radius: 22px;
  font-size: 13px; font-weight: 800;
  box-shadow: 0 0 16px rgba(0, 240, 255, 0.5);
  opacity: 0; transition: all 0.3s;
  pointer-events: none; z-index: 100; letter-spacing: 1px;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="topbar">
  <a class="back-btn" href="index.html" title="返回">‹</a>
  <div class="topbar-title">📝 手动记录净值</div>
  <div class="topbar-status" id="topStatus">就绪</div>
</div>

<div class="container">
  <!-- 基金卡片切换 -->
  <div class="fund-tabs" id="fundTabs"></div>

  <!-- 表单 -->
  <div class="form-card">
    <div class="form-title">新增记录</div>
    <div class="form-row">
      <div>
        <label class="form-label">基金</label>
        <select id="navFund" class="form-select"></select>
      </div>
      <div>
        <label class="form-label">日期</label>
        <input type="date" id="navDate" class="form-input" style="text-align:center">
      </div>
    </div>
    <div class="form-row full">
      <div>
        <label class="form-label">净值 (元)</label>
        <input type="number" step="0.0001" id="navValue" class="form-input" placeholder="0.0000">
      </div>
    </div>
    <div class="form-row full">
      <div>
        <label class="form-label">📷 图片识别 (从基金截图自动读取日期+净值)</label>
        <div class="action-row">
          <button class="btn btn-pick" id="pickBtn">🖼️ 从相册选择</button>
          <button class="btn btn-recognize" id="recBtn" disabled>🔍 开始识别</button>
        </div>
        <input type="file" id="fileInput" accept="image/*" style="display:none">
        <div class="preview-box" id="previewBox">
          <img id="previewImg" class="preview-img">
          <button class="preview-remove" id="previewRemove">×</button>
        </div>
        <div class="ocr-status" id="ocrStatus"></div>
      </div>
    </div>
    <div class="action-row">
      <button class="btn btn-add" id="addBtn" style="grid-column:span 2">＋ 添加到记录</button>
    </div>
  </div>

  <!-- 当前基金历史 -->
  <div class="history-card">
    <div class="form-title" id="historyTitle">历史记录 <span style="margin-left:auto;font-size:10px;color:var(--text-dim);font-weight:500;letter-spacing:1px;text-shadow:none">最新在前</span></div>
    <div id="historyBox">
      <div class="history-empty">还没有记录 · 填写上方表单添加</div>
    </div>
  </div>
</div>

<div class="ocr-overlay" id="ocrOverlay">
  <div class="ocr-spinner"></div>
  <div id="ocrOverlayText">正在识别中…</div>
</div>

<div class="toast" id="toast"></div>

<script>
const FUNDS_KEY = 'funds';
const NAV_KEY = 'nav_history';
let activeFundCode = null; // 当前选中的基金
function getFunds() { try { return JSON.parse(localStorage.getItem(FUNDS_KEY) || '[]'); } catch(e) { return []; } }
function getNavHistory() { try { return JSON.parse(localStorage.getItem(NAV_KEY) || '[]'); } catch(e) { return []; } }
function saveNavHistory(list) { localStorage.setItem(NAV_KEY, JSON.stringify(list)); }
function setStatus(t) { document.getElementById('topStatus').textContent = t; }

// ============== 基金卡片 ==============
function renderFundCards() {
  const funds = getFunds();
  const box = document.getElementById('fundTabs');
  const allHistory = getNavHistory();
  if (funds.length === 0) {
    box.innerHTML = '<div style="color:var(--text-dim);font-size:12px;padding:10px">暂无基金</div>';
    return;
  }
  // 数量统计
  const counts = {};
  allHistory.forEach(r => { counts[r.code] = (counts[r.code] || 0) + 1; });
  if (!activeFundCode || !funds.find(f => f.code === activeFundCode)) {
    activeFundCode = funds[0].code;
  }
  box.innerHTML = funds.map(f => {
    const cnt = counts[f.code] || 0;
    return `<div class="fund-card ${f.code === activeFundCode ? 'active' : ''}" data-code="${f.code}">
      <div class="fund-card-count">${cnt}</div>
      <div class="fund-card-name">${f.name}</div>
      <div class="fund-card-code">${f.code}</div>
    </div>`;
  }).join('');
  box.querySelectorAll('.fund-card').forEach(c => {
    c.onclick = () => {
      activeFundCode = c.dataset.code;
      document.getElementById('navFund').value = activeFundCode;
      renderFundCards();
      renderHistory();
    };
    // 双击: 跳转到对应加仓界面 (主页 buy-table)
    c.ondblclick = () => {
      const code = c.dataset.code;
      activeFundCode = code;
      // 检测主页是否已有该基金数据 (在 localStorage.funds 里查 buys 数)
      let hasData = false;
      try {
        const fundsRaw = localStorage.getItem('funds');
        if (fundsRaw) {
          const arr = JSON.parse(fundsRaw);
          const target = arr.find(f => f.code === code);
          if (target && Array.isArray(target.buys) && target.buys.length > 0) hasData = true;
        }
      } catch(e) {}
      const doJump = () => { location.href = 'index.html?fund=' + encodeURIComponent(code); };
      if (hasData) {
        // 弹窗确认是否覆盖 (用户描述: 录入数据存在时弹窗)
        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:99999;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)';
        const box = document.createElement('div');
        box.style.cssText = 'background:rgba(20,26,56,0.95);border:1.5px solid #00f0ff;border-radius:18px;padding:20px;min-width:280px;max-width:90vw;box-shadow:0 0 32px rgba(0,240,255,0.4);color:#fff;font-family:-apple-system,sans-serif';
        box.innerHTML = `
          <div style="font-size:16px;font-weight:800;color:#00f0ff;text-align:center;margin-bottom:8px;text-shadow:0 0 8px rgba(0,240,255,0.5);letter-spacing:1px">📊 切换加仓界面</div>
          <div style="font-size:13px;color:#cbd5e1;text-align:center;margin-bottom:14px;line-height:1.6">
            该基金已有 <b style="color:#fbbf24">交易记录</b>, 确认切换到加仓界面?
          </div>
          <div style="display:flex;gap:10px">
            <button id="jmpCancel" style="flex:1;padding:10px;background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2);border-radius:10px;font-size:13px;font-weight:600;cursor:pointer">取消</button>
            <button id="jmpOk" style="flex:1;padding:10px;background:linear-gradient(135deg,#00f0ff,#00b4d8);color:#05060b;border:none;border-radius:10px;font-size:13px;font-weight:800;cursor:pointer">切换</button>
          </div>
        `;
        overlay.appendChild(box);
        document.body.appendChild(overlay);
        box.querySelector('#jmpCancel').onclick = () => document.body.removeChild(overlay);
        box.querySelector('#jmpOk').onclick = () => { document.body.removeChild(overlay); doJump(); };
        overlay.onclick = (e) => { if (e.target === overlay) document.body.removeChild(overlay); };
      } else {
        // 无数据直接跳转
        doJump();
      }
    };
  });
}

function renderFundSelect() {
  const sel = document.getElementById('navFund');
  const funds = getFunds();
  if (funds.length === 0) {
    sel.innerHTML = '<option value="">暂无基金</option>';
    return;
  }
  sel.innerHTML = funds.map(f =>
    `<option value="${f.code}" data-name="${f.name}" ${f.code === activeFundCode ? 'selected' : ''}>${f.name} (${f.code})</option>`
  ).join('');
  sel.onchange = () => {
    activeFundCode = sel.value;
    renderFundCards();
    renderHistory();
  };
}

// ============== 历史表 ==============
function renderHistory() {
  const all = getNavHistory();
  // 严格按日期降序排序(最新在上)
  const list = all.filter(r => r.code === activeFundCode).slice().sort((a, b) => b.date.localeCompare(a.date));
  const box = document.getElementById('historyBox');
  const f = getFunds().find(x => x.code === activeFundCode);
  document.getElementById('historyTitle').innerHTML =
    `历史记录 - ${f ? f.name : '?'} (${list.length})<span style="margin-left:auto;font-size:10px;color:var(--text-dim);font-weight:500;letter-spacing:1px;text-shadow:none">最新在前</span>`;
  if (list.length === 0) {
    box.innerHTML = '<div class="history-empty">该基金还没有记录</div>';
    return;
  }
  const rows = list.map((r, i) => {
    const realIdx = all.indexOf(r);
    // 短日期: 8/3
    const short = (() => {
      const p = r.date.split('-');
      return p.length === 3 ? parseInt(p[1],10) + '/' + parseInt(p[2],10) : r.date;
    })();
    return `<tr>
      <td class="r" style="font-family:monospace;font-size:13px;font-weight:700">${short}</td>
      <td class="r nav">${r.nav.toFixed(4)}</td>
      <td class="c"><button class="del-btn" data-del="${realIdx}">✕</button></td>
    </tr>`;
  }).join('');
  box.innerHTML = `<table class="history-table">
    <thead><tr>
      <th class="r">日期 (M/D)</th><th class="r">净值</th><th class="c">操作</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
  box.querySelectorAll('[data-del]').forEach(btn => {
    btn.onclick = () => {
      const idx = parseInt(btn.dataset.del, 10);
      const list = getNavHistory();
      list.splice(idx, 1);
      saveNavHistory(list);
      renderFundCards();
      renderHistory();
      toast('已删除');
    };
  });
}

// ============== Toast ==============
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// ============== 添加记录 ==============
document.getElementById('addBtn').onclick = () => {
  const sel = document.getElementById('navFund');
  const code = sel.value || activeFundCode;
  if (!code) { toast('请选择基金'); return; }
  const name = sel.options[sel.selectedIndex].dataset.name;
  const date = document.getElementById('navDate').value;
  const valInp = document.getElementById('navValue');
  const nav = parseFloat(valInp.value);
  if (!date) { toast('请选择日期'); return; }
  if (isNaN(nav) || nav <= 0) {
    valInp.classList.add('shake');
    setTimeout(() => valInp.classList.remove('shake'), 500);
    return;
  }
  const list = getNavHistory();
  const existIdx = list.findIndex(r => r.code === code && r.date === date);
  if (existIdx >= 0) list[existIdx] = { code, name, date, nav, ts: Date.now() };
  else list.push({ code, name, date, nav, ts: Date.now() });
  saveNavHistory(list);
  const funds = getFunds();
  const f = funds.find(x => x.code === code);
  if (f) {
    f.price = nav;
    f.priceDate = date;
    f._manualPrice = true;
    localStorage.setItem(FUNDS_KEY, JSON.stringify(funds));
  }
  renderFundCards();
  renderHistory();
  valInp.value = '';
  toast('✓ 已记录');
};

// ============== 图片选择 ==============
let currentImage = null;
const fileInput = document.getElementById('fileInput');
document.getElementById('pickBtn').onclick = () => fileInput.click();
fileInput.onchange = (e) => {
  if (e.target.files && e.target.files[0]) handleImage(e.target.files[0]);
};
function handleImage(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    currentImage = e.target.result;
    document.getElementById('previewImg').src = currentImage;
    document.getElementById('previewBox').classList.add('show');
    document.getElementById('recBtn').disabled = false;
    document.getElementById('ocrStatus').textContent = '图片已加载 · 点击"开始识别"';
    document.getElementById('ocrStatus').className = 'ocr-status show';
  };
  reader.readAsDataURL(file);
}
function removeImage() {
  currentImage = null;
  document.getElementById('previewImg').src = '';
  document.getElementById('previewBox').classList.remove('show');
  document.getElementById('recBtn').disabled = true;
  fileInput.value = '';
  const s = document.getElementById('ocrStatus');
  s.className = 'ocr-status';
}
document.getElementById('previewRemove').onclick = removeImage;

// ============== OCR 识别 (解析 日期 + 净值 对) ==============
let tesseractWorker = null;
async function loadTesseract() {
  if (window.Tesseract) return;
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('Tesseract.js 加载失败'));
    document.head.appendChild(s);
  });
}
// 文本行级解析: 找日期 + 净值
function parseDateNavRows(text) {
  const lines = text.split(/\n+/).map(l => l.trim()).filter(Boolean);
  const rows = [];
  // 匹配: YYYY-MM-DD 或 YYYY/MM/DD 或 YYYYMMDD
  // 净值: 0.XXXX (4-5 位小数)
  const reDate = /(20\d{2})[\-\/年.](\d{1,2})[\-\/月.](\d{1,2})/;
  const reDateCompact = /(20\d{2})(\d{2})(\d{2})/;
  for (const line of lines) {
    let date = null, nav = null;
    // 标准格式
    let m = line.match(reDate);
    if (m) {
      const y = m[1], mo = m[2].padStart(2, '0'), d = m[3].padStart(2, '0');
      date = `${y}-${mo}-${d}`;
    } else {
      m = line.match(reDateCompact);
      if (m) date = `${m[1]}-${m[2]}-${m[3]}`;
    }
    // 净值: 找 0.XXXX 或 1.XXXX
    const navs = line.match(/\d+\.\d{3,5}/g) || [];
    for (const n of navs) {
      const v = parseFloat(n);
      if (v >= 0.1 && v <= 20) { nav = v; break; }
    }
    if (date && nav) rows.push({ date, nav });
  }
  return rows;
}

async function recognizeImage() {
  if (!currentImage) return;
  const recBtn = document.getElementById('recBtn');
  const overlay = document.getElementById('ocrOverlay');
  const overlayText = document.getElementById('ocrOverlayText');
  const status = document.getElementById('ocrStatus');
  recBtn.disabled = true;
  overlay.classList.add('show');
  overlayText.textContent = '加载识别引擎…';
  setStatus('识别中');
  try {
    await loadTesseract();
    overlayText.textContent = '正在识别图片…';
    if (!tesseractWorker) {
      tesseractWorker = await Tesseract.createWorker('chi_sim+eng', 1, {
        logger: (m) => {
          if (m.status === 'recognizing text') {
            overlayText.textContent = `识别中… ${Math.round((m.progress || 0) * 100)}%`;
          }
        }
      });
    }
    const { data } = await tesseractWorker.recognize(currentImage);
    overlay.classList.remove('show');
    recBtn.disabled = false;
    setStatus('就绪');
    const text = data.text || '';
    // 解析日期+净值
    const rows = parseDateNavRows(text);
    if (rows.length === 0) {
      status.className = 'ocr-status show err';
      status.textContent = '❌ 未识别到日期+净值对 · 请检查图片或手动输入';
      return;
    }
    // 批量保存到当前基金
    const sel = document.getElementById('navFund');
    const code = sel.value || activeFundCode;
    if (!code) { toast('请先选择基金'); return; }
    const name = sel.options[sel.selectedIndex].dataset.name;
    const list = getNavHistory();
    let added = 0;
    rows.forEach(({ date, nav }) => {
      const existIdx = list.findIndex(r => r.code === code && r.date === date);
      if (existIdx >= 0) list[existIdx] = { code, name, date, nav, ts: Date.now() };
      else list.push({ code, name, date, nav, ts: Date.now() });
      added++;
    });
    saveNavHistory(list);
    // 同步: 最新一条作为当前价
    const sorted = rows.slice().sort((a, b) => b.date.localeCompare(a.date));
    const latest = sorted[0];
    const funds = getFunds();
    const f = funds.find(x => x.code === code);
    if (f && latest) {
      f.price = latest.nav;
      f.priceDate = latest.date;
      f._manualPrice = true;
      localStorage.setItem(FUNDS_KEY, JSON.stringify(funds));
    }
    renderFundCards();
    renderHistory();
    removeImage();
    status.className = 'ocr-status show ok';
    status.textContent = `✓ 识别成功 ${added} 个日期+净值对 · 已添加到 [${name}]`;
    toast(`+${added} 条记录`);
  } catch (e) {
    overlay.classList.remove('show');
    recBtn.disabled = false;
    setStatus('失败');
    status.className = 'ocr-status show err';
    status.textContent = '❌ 识别失败: ' + (e.message || '未知错误');
    console.error(e);
  }
}
document.getElementById('recBtn').onclick = recognizeImage;

// ============== 初始化 ==============
const funds = getFunds();
if (funds.length > 0) activeFundCode = funds[0].code;
renderFundSelect();
renderFundCards();
renderHistory();
document.getElementById('navDate').value = new Date().toISOString().split('T')[0];
</script>
